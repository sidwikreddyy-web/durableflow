spring:
  application:
    name: durableflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/durableflow}
    username: ${DATABASE_USERNAME:durableflow}
    password: ${DATABASE_PASSWORD:durableflow}
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

durableflow:
  auth:
    issuer: durableflow
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-1234567890}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    secure-cookies: ${SECURE_COOKIES:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  worker:
    enabled: ${WORKER_ENABLED:true}
    poll-delay-ms: 1000
    lease-seconds: 30
    batch-size: 10
