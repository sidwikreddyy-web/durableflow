services:
  - type: web
    name: durableflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      - key: WORKER_ENABLED
        value: "true"
