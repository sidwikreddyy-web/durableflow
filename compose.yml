services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: durableflow
      POSTGRES_USER: durableflow
      POSTGRES_PASSWORD: durableflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durableflow -d durableflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - durableflow-postgres:/var/lib/postgresql/data

volumes:
  durableflow-postgres:
